name: Metric

options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: nl

configFiles:
  Debug: Config/Metric.xcconfig
  Release: Config/Metric.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

packages:
  MetricCore:
    path: MetricCore

targets:
  Metric:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Metric
      - path: Shared
    dependencies:
      - package: MetricCore
      - target: MetricWatch
    info:
      path: Metric/Info.plist
      properties:
        CFBundleDisplayName: Metric
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
        NSHealthShareUsageDescription: Metric leest je workouts, routes en hartslag uit Gezondheid om je activiteiten en voortgang te tonen.
        NSHealthUpdateUsageDescription: Metric bewaart de workouts die je met de app opneemt in Gezondheid.
        NSLocationWhenInUseUsageDescription: Metric gebruikt je locatie om de route en afstand van je workout vast te leggen.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        MetricAPIBaseURL: $(METRIC_API_BASE_URL)
    entitlements:
      path: Metric/Metric.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(METRIC_BUNDLE_ID)
        PRODUCT_NAME: Metric
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  MetricWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: MetricWatch
      - path: Shared
    dependencies:
      - package: MetricCore
    info:
      path: MetricWatch/Info.plist
      properties:
        CFBundleDisplayName: Metric
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(METRIC_BUNDLE_ID)
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: Metric leest je hartslag, energie en afstand om je workout live te tonen.
        NSHealthUpdateUsageDescription: Metric bewaart de workouts die je op je Watch opneemt in Gezondheid.
    entitlements:
      path: MetricWatch/MetricWatch.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(METRIC_BUNDLE_ID).watchkitapp
        PRODUCT_NAME: MetricWatch
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

schemes:
  Metric:
    build:
      targets:
        Metric: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  MetricWatch:
    build:
      targets:
        MetricWatch: all
    run:
      config: Debug
    archive:
      config: Release
